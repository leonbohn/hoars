[package]
name = "hoars"
version = "0.2.1"
description = "A library for dealing with the HOA (Hanoi Omega Automata) file format."
repository = "https://github.com/leonbohn/hoars"
homepage = "https://github.com/leonbohn/hoars"
readme = "README.md"
keywords = ["omega-automata", "hoa", "automata"]
categories = ["encoding", "parser-implementations"]
license = "MIT"
edition = "2024"
authors = ["León Bohn <bohn@lics.rwth-aachen.de>"]
exclude = ["hoa/*", "doc/hoaf.pdf"]

[dependencies]
tracing = "0.1"
biodivine-lib-bdd = "0.6.3"
itertools = "0.14.0"

ariadne = "0.6"
chumsky = { version = "0.9.3", default-features = false, features = [
    "ahash",
    "std",
] }
lazy_static = "1.5.0"
